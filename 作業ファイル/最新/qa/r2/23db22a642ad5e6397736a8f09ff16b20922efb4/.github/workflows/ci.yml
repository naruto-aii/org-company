name: CI

on:
  pull_request:
  push:
    branches:
      - web-preview
      - main

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # lib and test already have warnings. Errors still fail the job.
      # tool/ holds prototypes that are not part of the app.
      - run: flutter analyze lib test --no-fatal-infos --no-fatal-warnings
      - run: flutter test
